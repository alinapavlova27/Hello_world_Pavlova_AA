<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анализ товаров - student_task</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>📊 Анализ базы данных товаров</h1>
    <p>Интерактивный дашборд для student_task (products, prices, suppliers)</p>
</header>

<div class="layout">

    <aside class="controls">
        <h2>📈 Статистика</h2>
        <button class="action-btn"
                data-action="stat"
                data-metric="mean">💰 Средняя цена</button>
        <button class="action-btn"
                data-action="stat"
                data-metric="median">📊 Медианная цена</button>
        <button class="action-btn"
                data-action="stat"
                data-metric="total">🔢 Количество записей</button>
        <button class="action-btn"
                data-action="stat"
                data-metric="min">⬇ Минимальная цена</button>
        <button class="action-btn"
                data-action="stat"
                data-metric="max">⬆ Максимальная цена</button>
        <button class="action-btn"
                data-action="stat"
                data-metric="std">📉 Стандартное отклонение</button>

        <h2>📊 Графики</h2>
        <button class="action-btn"
                data-action="chart"
                data-kind="histogram">📊 Распределение цен</button>
        <button class="action-btn"
                data-action="chart"
                data-kind="categories">📊 Средняя цена по категориям</button>

        <button class="action-btn clear"
                id="clear-btn">🗑 Очистить</button>
    </aside>

    <main id="result-area">
        <p class="placeholder">
            ← Нажмите кнопку слева, чтобы увидеть результат
        </p>
    </main>

</div>

<footer>
    <p>© 2026 Алина Павлова · Курс «Информатика»</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
