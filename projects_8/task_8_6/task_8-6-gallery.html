<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой день</title>
    <style>
        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        figure {
            background: white;
            margin: 20px 0;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        img {
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        figcaption {
            margin-top: 10px;
            font-size: 16px;
            color: #555;
            font-weight: bold;
        }
        a {
            display: inline-block;
        }
    </style>
</head>
<body>

<h1>Мой день</h1>

<figure>
    <img src="images/1_wakeup.jpg"
         alt="Просыпаюсь утром"
         width="600" height="400"
         loading="eager">
    <figcaption>Просыпаюсь</figcaption>
</figure>

<figure>
    <img src="images/2_breakfast.jpg"
         alt="Завтрак"
         width="600" height="400"
         loading="lazy">
    <figcaption>Завтракаю</figcaption>
</figure>

<figure>
    <a href="images/3_university.jpg" target="_blank">
        <img src="images/3_university.jpg"
             alt="Дорога в университет"
             width="600" height="400"
             loading="lazy">
    </a>
    <figcaption>Иду в универ</figcaption>
</figure>

<figure>
    <img src="images/4_dorm.jpg"
         alt="Возвращение в общежитие"
         width="600" height="400"
         loading="lazy">
    <figcaption>Возвращаюсь в общагу</figcaption>
</figure>

<figure>
    <img src="images/5_shower.jpg"
         alt="Душ"
         width="600" height="400"
         loading="lazy">
    <figcaption>Иду мыться</figcaption>
</figure>

<figure>
    <img src="images/6_relax.jpg"
         alt="Отдыхаю"
         width="600" height="400"
         loading="lazy">
    <figcaption>Отдыхаю</figcaption>
</figure>

<figure>
    <img src="images/7_homework.jpg"
         alt="Делаю домашнее задание"
         width="600" height="400"
         loading="lazy">
    <figcaption>Делаю задания</figcaption>
</figure>

<figure>
    <img src="images/8_sleep.jpg"
         alt="Ложусь спать"
         width="600" height="400"
         loading="lazy">
    <figcaption>Ложусь спать</figcaption>
</figure>

</body>
</html>
